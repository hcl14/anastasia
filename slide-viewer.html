<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Slide viewer</title>
<style>
:root{--bg:#10141f;--fg:#e8ecf3;--muted:#9aa6b8;--accent:#7fb2ff;--bar:#3d8bfd}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
header{padding:8px 14px;background:#14213d;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
header h1{font-size:17px;margin:0;font-weight:600}header .meta{color:var(--muted);font-size:13px}
header a{color:var(--accent);font-size:13.5px}
#wrap{position:relative;flex:1;min-height:300px}
#osd{position:absolute!important;top:0;left:0;width:100%;height:100%;background:#fff}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(16,20,31,.92);z-index:10}
#load .box{width:min(440px,86vw);text-align:center}
#load .track{height:10px;background:#2a3346;border-radius:6px;overflow:hidden;margin:12px 0 8px}
#load .fill{height:100%;width:0;background:var(--bar);transition:width .15s}
#load .fill.ind{width:30%;animation:ind 1.2s infinite ease-in-out}
@keyframes ind{0%{margin-left:-30%}100%{margin-left:100%}}
#load .t{font-size:16px}#load .s{color:var(--muted);font-size:13.5px}
#scale{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(255,255,255,.88);color:#111;padding:3px 8px 5px;border-radius:4px;font-size:12.5px;pointer-events:none;display:none}
#scale .b{height:5px;background:#111;margin-top:3px}
#info{color:var(--muted);font-size:12.5px;padding:6px 14px;background:#14213d}
</style>
</head>
<body>
<header><h1 id="title">Slide viewer</h1><span class="meta" id="sub"></span>
<a href="slides-2026-11.html" id="back">← all slide scans</a><a id="svs" href="#" target="_blank">original SVS on Drive</a><a id="dl" href="#" target="_blank">this JPEG on Drive</a></header>
<div id="wrap"><div id="osd"></div>
<div id="load"><div class="box"><div class="t" id="lt">Preparing…</div><div class="track"><div class="fill" id="lf"></div></div><div class="s" id="ls"></div></div></div>
<div id="scale"><span id="sl"></span><div class="b" id="sb"></div></div></div>
<div id="info">Scroll or pinch to zoom, drag to move. This image is a reduced copy of the scan for viewing in the browser; for cell detail at full 40× open the original SVS in QuPath, ImageScope or ASAP.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/openseadragon.min.js"></script>
<script>
(async function(){
const $=id=>document.getElementById(id);
const fail=(msg)=>{$('lt').textContent='Could not open the image';$('ls').innerHTML=msg;$('lf').classList.remove('ind');$('lf').style.width='0'};
const sid=new URLSearchParams(location.search).get('s');
let meta;
try{meta=(await (await fetch('img/slides_2026-11/zoom.json',{cache:'no-cache'})).json())[sid];}catch(e){}
if(!meta){fail('Unknown slide. <a href="slides-2026-11.html" style="color:#7fb2ff">Back to the slide list</a>.');return}
document.title=meta.label+' · slide viewer';$('title').textContent=meta.label;
$('sub').textContent=meta.block+' · '+meta.w+' × '+meta.h+' px, '+meta.um.toFixed(2)+' µm per pixel'+(meta.ratio>1.01?' (1:'+meta.ratio.toFixed(1)+' of the original scan)':' (full original resolution)');
$('svs').href='https://drive.google.com/file/d/'+meta.svs+'/view';
// Drive API key: restricted to the Drive API and to https://hcl14.github.io/* (plain Drive links are blocked for cross-site loading)
const KEY='AIzaSyB0kAbntnLSG_wOMeTPxayaW5MsYl7RPH0';
const url='https://www.googleapis.com/drive/v3/files/'+meta.d+'?alt=media&key='+KEY;
$('dl').href='https://drive.google.com/file/d/'+meta.d+'/view';$('back').href='slides-2026-11.html#s-'+sid;
// 1. download with progress
$('lt').textContent='Downloading image';
let blob;
try{
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const total=+r.headers.get('content-length')||meta.bytes||0;
  if(r.body&&r.body.getReader){
    const rd=r.body.getReader(),chunks=[];let got=0,t0=performance.now();
    for(;;){const {done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.length;
      const p=total?Math.min(100,got/total*100):0,sp=got/1e6/((performance.now()-t0)/1000+1e-3);
      $('lf').style.width=p.toFixed(1)+'%';
      $('ls').textContent=(got/1e6).toFixed(1)+' of '+(total/1e6).toFixed(1)+' MB · '+p.toFixed(0)+' % · '+sp.toFixed(1)+' MB/s'+(total&&sp>0?' · about '+Math.max(0,Math.round((total-got)/1e6/sp))+' s left':'');}
    blob=new Blob(chunks,{type:'image/jpeg'});
  }else{$('lf').classList.add('ind');blob=await r.blob();}
}catch(e){fail('Download failed ('+e.message+'). You can <a style="color:#7fb2ff" href="https://drive.google.com/file/d/'+meta.d+'/view">open the JPEG on Google Drive</a>.');return}
// 2. decode
$('lt').textContent='Decoding image';$('ls').textContent=meta.w+' × '+meta.h+' px; this takes a few seconds';$('lf').style.width='0';$('lf').classList.add('ind');
await new Promise(r=>setTimeout(r,30));
let src;
try{
  if(window.createImageBitmap)src=await createImageBitmap(blob);
  else{src=new Image();src.src=URL.createObjectURL(blob);await src.decode();}
}catch(e){fail('This device could not decode an image of '+meta.w+' × '+meta.h+' px (phones often cannot). Please open it on a computer, or <a style="color:#7fb2ff" href="https://drive.google.com/file/d/'+meta.d+'/view">download the JPEG from Google Drive</a>.');return}
const W=meta.w,H=meta.h,TS=512;
// mip chain: halvings of the full image, built on demand
const mips=[src];
function mip(k){
  while(mips.length<=k){const p=mips[mips.length-1],pw=p.width,ph=p.height,c=document.createElement('canvas');
    c.width=Math.max(1,Math.ceil(pw/2));c.height=Math.max(1,Math.ceil(ph/2));const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(p,0,0,c.width,c.height);mips.push(c);}
  return mips[k];
}
const maxLevel=Math.ceil(Math.log2(Math.max(W,H)));
const ts=new OpenSeadragon.TileSource({width:W,height:H,tileSize:TS,tileOverlap:0,minLevel:0,maxLevel:maxLevel});
ts.getTileUrl=(l,x,y)=>sid+'/'+l+'/'+x+'_'+y;
ts.downloadTileStart=function(ctx){
  try{
    const m=ctx.src.split('/'),l=+m[1],xy=m[2].split('_'),x=+xy[0],y=+xy[1];
    const s=ts.getLevelScale(l),lw=Math.ceil(W*s),lh=Math.ceil(H*s);
    const tw=Math.min(TS,lw-x*TS),th=Math.min(TS,lh-y*TS);
    const k=Math.max(0,Math.min(12,Math.floor(Math.log2(1/s)+1e-9))),mp=mip(k),ms=mp.width/W;
    const c=document.createElement('canvas');c.width=tw;c.height=th;const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
    g.drawImage(mp,x*TS/s*ms,y*TS/s*ms,tw/s*ms,th/s*ms,0,0,tw,th);
    ctx.finish(c);
  }catch(e){ctx.finish(null,null,String(e));}
};
ts.downloadTileAbort=function(){};
const v=OpenSeadragon({element:$('osd'),tileSources:ts,prefixUrl:'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/images/',
  showNavigator:true,navigatorPosition:'TOP_RIGHT',maxZoomPixelRatio:2,visibilityRatio:.5,immediateRender:true,imageLoaderLimit:8,
  gestureSettingsMouse:{clickToZoom:false},crossOriginPolicy:false});
v.addHandler('open',()=>{$('load').style.display='none';$('scale').style.display='block';upd();});
v.addHandler('open-failed',e=>fail('Viewer error: '+(e.message||'unknown')));
const nice=[1,2,5,10,20,50,100,200,500,1000,2000,5000,10000];
function upd(){
  if(!v.world.getItemCount())return;
  const z=v.world.getItemAt(0).viewportToImageZoom(v.viewport.getZoom(true)); // screen px per image px
  const umPerScreen=meta.um/z;let L=nice[0];for(const n of nice){if(n/umPerScreen<=150)L=n;}
  $('sb').style.width=(L/umPerScreen).toFixed(0)+'px';$('sl').textContent=L>=1000?(L/1000)+' mm':L+' µm';
}
v.addHandler('animation',upd);v.addHandler('resize',upd);
})();
</script>
</body>
</html>
